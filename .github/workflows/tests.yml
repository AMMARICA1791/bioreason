name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run auditable council smoke test
        run: PYTHONPATH=src python scripts/smoke_council.py
      - name: Upload council evidence trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-trace-py${{ matrix.python-version }}
          path: artifacts/council-smoke.json
          if-no-files-found: ignore
