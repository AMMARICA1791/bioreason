name: BioReason open science model council

on:
  push:
    paths:
      - '.github/workflows/open-science-council.yml'
      - 'scripts/science_model_council.py'
      - 'src/bioreason/multidomain.py'
      - 'tests/test_science_model_council.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bioreason-open-science-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local CPU models and dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'transformers>=4.45,<5' 'safetensors>=0.4'
      - name: Validate research scaffolding
        run: PYTHONPATH=src python -m unittest discover -s tests -q
      - name: Run science-wide local model-backed council
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: PYTHONPATH=src python scripts/science_model_council.py
      - name: Archive real source records, all role turns, citations and objections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-science-model-council-evidence
          path: artifacts/science-model-council.json
          if-no-files-found: warn
          retention-days: 30
