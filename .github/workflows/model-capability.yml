name: BioReason local model capability comparison

on:
  push:
    paths:
      - '.github/workflows/model-capability.yml'
      - 'scripts/model_capability_probe.py'
      - 'evaluation/model_capability_cases.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bioreason-model-capability-diagnostic
  cancel-in-progress: false

jobs:
  compare-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only, open-model inference dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'transformers>=4.45,<5' 'safetensors>=0.4'
      - name: Run offline BioReason regression checks
        run: PYTHONPATH=src python -m unittest discover -s tests -q
      - name: Compare Qwen 0.5B and 1.5B on two fixed research records
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: PYTHONPATH=src python scripts/model_capability_probe.py
      - name: Archive exact prompts and generated responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-model-capability-evidence
          path: |
            artifacts/model-capability-probe.json
            evaluation/model_capability_cases.json
          if-no-files-found: warn
          retention-days: 30
