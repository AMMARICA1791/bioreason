name: BioReason real model council proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bioreason-real-model-council
  cancel-in-progress: false

jobs:
  model-council:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore previous verified corrective lessons
        uses: actions/cache/restore@v4
        with:
          path: .bioreason_state/lessons.json
          key: bioreason-corrective-memory-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bioreason-corrective-memory-v1-
      - name: Install free CPU inference runtime
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'transformers>=4.45,<5' 'safetensors>=0.4'
      - name: Check council tests before inference
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run real local model and eight-role council
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: PYTHONPATH=src python scripts/model_council.py
      - name: Independently recompute solo-versus-council comparison
        run: PYTHONPATH=src python scripts/evaluate_run.py
      - name: Preserve model outputs and council evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-council-evidence
          path: |
            artifacts/model-council.json
            artifacts/comparison-verification.json
            .bioreason_state/lessons.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
      - name: Persist updated lessons for the next run
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .bioreason_state/lessons.json
          key: bioreason-corrective-memory-v1-${{ github.run_id }}-${{ github.run_attempt }}
